apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: reliability-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reliability-web
  template:
    metadata:
      labels:
        app: reliability-web
    spec:
      containers:
        - name: web
          image: pf-reliability-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3012
              name: http
          env:
            - name: PORT
              value: "3012"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_RELIABILITY_API_URL
              value: http://reliability-api.localhost
          readinessProbe:
            httpGet:
              path: /
              port: 3012
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3012
            initialDelaySeconds: 25
            periodSeconds: 10
